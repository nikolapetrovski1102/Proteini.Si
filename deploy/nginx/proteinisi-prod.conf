# Production: proteini.mk (React) and api.proteini.mk (.NET API on :6800).

server {
    listen 80;
    listen [::]:80;
    server_name www.proteini.mk;
    return 301 https://proteini.mk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name proteini.mk;

    root /srv/proteinisi/prod/web;
    index index.html;

    # Vite hashes these file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Old links and payment callbacks still point at proteini.mk/api.
    location /api/ {
        proxy_pass http://proteinisi_prod_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
    }

    # Uploaded images live in the API's wwwroot; nginx serves them directly.
    # Every upload gets a unique file name, so images never change in place and can be
    # cached by browsers and the Cloudflare edge. Replaced/deleted files are purged by the API.
    location ~ ^/(uploads|product-images|product-gallery|variant-gallery|variant-images|home-slider)/ {
        root /srv/proteinisi/prod/api/wwwroot;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.proteini.mk;

    location ~ ^/(uploads|product-images|product-gallery|variant-gallery|variant-images|home-slider)/ {
        root /srv/proteinisi/prod/api/wwwroot;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @api;
    }

    # These files keep their names when they change, so keep the cache short.
    location ~ ^/(logos|css|js|lib)/ {
        root /srv/proteinisi/prod/api/wwwroot;
        expires 30d;
        access_log off;
        try_files $uri @api;
    }

    location / {
        proxy_pass http://proteinisi_prod_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
    }

    location @api {
        proxy_pass http://proteinisi_prod_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
    }
}
