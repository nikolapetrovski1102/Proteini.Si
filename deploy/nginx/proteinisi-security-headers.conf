# Browser security headers for proteini.mk and stage.proteini.mk (installed to /etc/nginx/snippets/).
# nginx ignores server-level add_header lines inside any location that has its own add_header,
# so every such location includes this file again (see proteinisi-prod.conf / proteinisi-stage.conf).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
