# Content-Security-Policy for the shop's HTML (installed to /etc/nginx/snippets/).
# Included only in `location = /index.html`, so API responses (e.g. the cPay return page) are untouched.
#
# Allowed outside services: Google sign-in, Cloudflare Turnstile + Web Analytics, Meta Pixel,
# Google Fonts, photon.komoot.io address search, YouTube/Instagram/TikTok/Google Maps embeds,
# and the cPay card form. form-action allows any https: target because Chrome also checks redirects
# after the form posts, and cPay can hand off to a bank's 3-D Secure page on another domain.
#
# Hashes:
#   sha256-XEzn...  = the inline dark-theme script in frontend/index.html. If that script changes,
#                     recompute: printf '%s' "<script body>" | openssl dgst -sha256 -binary | base64
#   sha256-ePni...  = the cPay form's onload handler "document.forms[0].submit()" (CPayService.cs),
#                     which Checkout.jsx writes into the page with document.write.
#
# Rollout: starts as Content-Security-Policy-Report-Only (violations only show in the browser console).
# Once the console is clean on all pages, rename the header to Content-Security-Policy and redeploy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-XEzniih5+VJTed3DHXmyqYx/gVjjosCoEZFyKqbFCR4=' 'unsafe-hashes' 'sha256-ePniVEkSivX/c7XWBGafqh8tSpiRrKiqYeqbG7N1TOE=' https://accounts.google.com/gsi/client https://challenges.cloudflare.com https://connect.facebook.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://photon.komoot.io https://accounts.google.com/gsi/ https://www.facebook.com https://connect.facebook.net https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.instagram.com https://www.tiktok.com https://maps.google.com https://www.google.com https://accounts.google.com/gsi/ https://challenges.cloudflare.com; worker-src 'self' blob:; form-action 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
