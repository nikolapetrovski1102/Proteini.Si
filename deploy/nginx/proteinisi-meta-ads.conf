# Meta ads dashboard: meta-ads.proteini.mk (staff only; sign-in via Duo or emailed code).
# Static app from /srv/proteinisi/meta-ads/web; only /api/meta-ads/ is proxied to the production API,
# so the shop API is not reachable through this host. Product photos are served same-origin so the
# browser can turn them into ad images. HTTPS is added by certbot (certbot --nginx -d meta-ads.proteini.mk).

server {
    listen 80;
    listen [::]:80;
    server_name meta-ads.proteini.mk;

    root /srv/proteinisi/meta-ads/web;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.fbcdn.net https://*.facebook.com; frame-src https://*.facebook.com https://challenges.cloudflare.com; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.fbcdn.net https://*.facebook.com; frame-src https://*.facebook.com https://challenges.cloudflare.com; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location /api/meta-ads/ {
        proxy_pass http://proteinisi_prod_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
        limit_req zone=proteinisi_prod burst=40 nodelay;
    }

    # Anything else under /api is not part of the dashboard.
    location /api/ {
        return 404;
    }

    location ~ ^/(uploads|product-images|product-gallery|variant-gallery|variant-images)/ {
        root /srv/proteinisi/prod/api/wwwroot;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
