# Shared http-level settings (installed to /etc/nginx/conf.d/).

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml image/svg+xml application/manifest+json;

open_file_cache max=2000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_errors on;

client_max_body_size 50m;
keepalive_timeout 30s;

upstream proteinisi_prod_api {
    server 127.0.0.1:6800;
    keepalive 32;
}

upstream proteinisi_stage_api {
    server 127.0.0.1:6801;
    keepalive 4;
}

# Throttle staging API calls so it can never crowd out production.
limit_req_zone $binary_remote_addr zone=proteinisi_stage:5m rate=30r/s;
