# Staging: stage.proteini.mk (React) and stage-api.proteini.mk (.NET API on :6801).
# Kept out of search engines; API calls are rate limited so staging never competes with production.

server {
    listen 80;
    listen [::]:80;
    server_name stage.proteini.mk;

    root /srv/proteinisi/stage/web;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://proteinisi_stage_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
        limit_req zone=proteinisi_stage burst=100 nodelay;
    }

    # Every upload gets a unique file name, so images never change in place and can be
    # cached by browsers and the Cloudflare edge. Replaced/deleted files are purged by the API.
    location ~ ^/(uploads|product-images|product-gallery|variant-gallery|variant-images|home-slider)/ {
        root /srv/proteinisi/stage/api/wwwroot;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stage-api.proteini.mk;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(uploads|product-images|product-gallery|variant-gallery|variant-images|home-slider)/ {
        root /srv/proteinisi/stage/api/wwwroot;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri @api;
    }

    # These files keep their names when they change, so keep the cache short.
    location ~ ^/(logos|css|js|lib)/ {
        root /srv/proteinisi/stage/api/wwwroot;
        expires 1d;
        access_log off;
        try_files $uri @api;
    }

    location / {
        proxy_pass http://proteinisi_stage_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
        limit_req zone=proteinisi_stage burst=100 nodelay;
    }

    location @api {
        proxy_pass http://proteinisi_stage_api;
        include /etc/nginx/snippets/proteinisi-proxy.conf;
        limit_req zone=proteinisi_stage burst=100 nodelay;
    }
}
