<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 262 270" width="262" height="270" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    /*
      4.4s loop:
      dip into the open pouch -> lift a level scoop of white creatine ->
      carry over the shaker -> flip the scoop -> powder pours in a stream ->
      water turns cloudy -> creatine settles to the bottom -> repeat
    */
    .scoop  { transform-box: view-box; transform-origin: 0 0; animation: scoop 4.4s infinite; will-change: transform; }
    .heap   { transform-box: fill-box; transform-origin: 50% 100%; animation: heap 4.4s infinite; }
    .stream { transform-box: fill-box; transform-origin: 50% 0; animation: stream 4.4s infinite; }
    .grain  { opacity: 0; animation: fall 4.4s infinite; }
    .g2 { animation-delay: 0.048s; } .g3 { animation-delay: 0.096s; } .g4 { animation-delay: 0.144s; } .g5 { animation-delay: 0.192s; } .g6 { animation-delay: 0.24s; }
    .puff   { opacity: 0; transform-box: fill-box; transform-origin: center; animation: puff 4.4s infinite; }
    .p2 { animation-delay: 0.064s; } .p3 { animation-delay: 0.128s; }
    .cloud  { opacity: 0; animation: cloud 4.4s infinite; }
    .settle { transform-box: fill-box; transform-origin: 50% 100%; animation: settle 4.4s infinite; }
    .splash { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: splash 4.4s ease-out infinite; }
    .s2 { animation-delay: 0.08s; } .s3 { animation-delay: 0.16s; }
    .ripple { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 4.4s ease-out infinite; }
    .wave   { animation: wave 3s linear infinite; }
    .dot    { transform-box: fill-box; transform-origin: center; animation: pulse 1.12s cubic-bezier(.37,0,.63,1) infinite; }
    .d2 { animation-delay: 0.16s; } .d3 { animation-delay: 0.32s; }

    @keyframes scoop {
      0%        { transform: translate(78px,90px)  rotate(0deg);   animation-timing-function: cubic-bezier(.45,0,.55,1); }
      12%       { transform: translate(74px,126px) rotate(-10deg); animation-timing-function: cubic-bezier(.45,0,.55,1); }
      20%       { transform: translate(68px,128px) rotate(12deg);  animation-timing-function: cubic-bezier(.45,0,.55,1); }
      30%       { transform: translate(76px,84px)  rotate(0deg);   animation-timing-function: cubic-bezier(.45,0,.55,1); }
      46%       { transform: translate(200px,50px) rotate(0deg);   animation-timing-function: cubic-bezier(.65,0,.35,1); }
      54%, 66%  { transform: translate(200px,52px) rotate(170deg); animation-timing-function: cubic-bezier(.65,0,.35,1); }
      75%       { transform: translate(200px,50px) rotate(0deg);   animation-timing-function: cubic-bezier(.45,0,.55,1); }
      94%, 100% { transform: translate(78px,90px)  rotate(0deg); }
    }
    @keyframes heap {
      0%, 17%   { transform: scale(.3, 0); opacity: 0; }
      24%, 50%  { transform: scale(1, 1);  opacity: 1; animation-timing-function: cubic-bezier(.45,0,.55,1); }
      56%, 100% { transform: scale(.6, 0); opacity: 0; }
    }
    @keyframes stream {
      0%, 50%   { transform: translateY(0) scaleY(0);   opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      51%       { transform: translateY(0) scaleY(0);   opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      57%       { transform: translateY(0) scaleY(1);   opacity: 1; }
      63%       { transform: translateY(0) scaleY(1);   opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      68%       { transform: translateY(72px) scaleY(0); opacity: 1; }
      69%, 100% { transform: translateY(72px) scaleY(0); opacity: 0; }
    }
    @keyframes fall {
      0%, 52%   { transform: translateY(0);    opacity: 0; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      53%       { transform: translateY(0);    opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
      62%       { transform: translateY(70px); opacity: .9; }
      63%, 100% { transform: translateY(72px); opacity: 0; }
    }
    @keyframes puff {
      0%, 16%   { transform: translateY(0) scale(.4); opacity: 0; }
      21%       { opacity: .9; }
      30%, 100% { transform: translateY(-14px) scale(1.3); opacity: 0; }
    }
    @keyframes cloud {
      0%, 56%   { opacity: 0; animation-timing-function: ease-out; }
      66%       { opacity: .85; animation-timing-function: ease-in-out; }
      86%, 100% { opacity: 0; }
    }
    @keyframes settle {
      0%, 64%   { transform: scaleY(0); opacity: 1; animation-timing-function: cubic-bezier(.33,1,.68,1); }
      84%       { transform: scaleY(1); opacity: 1; animation-timing-function: ease-in-out; }
      98%, 100% { transform: scaleY(1); opacity: 0; }
    }
    @keyframes ripple {
      0%, 58%   { transform: scale(.3); opacity: 0; }
      61%       { opacity: .9; }
      72%, 100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes splash {
      0%, 56%   { transform: translate(0,0) scale(.5); opacity: 0; }
      58%       { opacity: 1; }
      64%, 100% { transform: translate(var(--dx),-9px) scale(1); opacity: 0; }
    }
    @keyframes wave  { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes pulse {
      0%, 100% { opacity: .35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scoop { animation: none; transform: translate(78px,90px); }
      .heap, .settle { animation: none; }
      .stream, .grain, .puff, .cloud, .ripple, .splash { animation: none; opacity: 0; }
      .wave  { animation-duration: 4.8s; }
    }
  </style>

  <defs>
    <clipPath id="shaker-clip">
      <path d="M64 86 L136 86 L131 214 Q131 220 125 220 L75 220 Q69 220 69 214 Z"/>
    </clipPath>
    <clipPath id="pouch-clip">
      <path d="M24 120 Q72 127 120 120 L122 220 Q122 234 108 234 L36 234 Q22 234 22 220 Z"/>
    </clipPath>

    <linearGradient id="g-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1A1415"/>
      <stop offset=".35" stop-color="#3A3234"/>
      <stop offset="1"   stop-color="#151011"/>
    </linearGradient>
    <linearGradient id="g-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDB4D"/>
      <stop offset="1" stop-color="#F5BE00"/>
    </linearGradient>
    <linearGradient id="g-pouch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#F3F1EC"/>
      <stop offset=".3"  stop-color="#FFFFFF"/>
      <stop offset=".75" stop-color="#FAF9F6"/>
      <stop offset="1"   stop-color="#E6E3DC"/>
    </linearGradient>
    <linearGradient id="g-pouch-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E6E0"/>
      <stop offset="1" stop-color="#CFCAC0"/>
    </linearGradient>
    <linearGradient id="g-powder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEECE7"/>
    </linearGradient>
    <linearGradient id="g-stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#FFFFFF"/>
      <stop offset=".8" stop-color="#FFFFFF"/>
      <stop offset="1"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#FBFAF7"/>
      <stop offset="1"  stop-color="#EFECE6"/>
    </linearGradient>
    <!-- Plain water: very light, slightly warm so it sits in the palette -->
    <linearGradient id="g-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF0CC"/>
      <stop offset="1" stop-color="#F3DE9E"/>
    </linearGradient>
    <linearGradient id="g-water-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF8E6"/>
      <stop offset="1" stop-color="#F8EBBF"/>
    </linearGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <linearGradient id="g-stream-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#D9D3C5"/>
      <stop offset=".35" stop-color="#FFFFFF"/>
      <stop offset=".7"  stop-color="#FFFFFF"/>
      <stop offset="1"   stop-color="#D2CBBD"/>
    </linearGradient>
    <linearGradient id="g-mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F887C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8F887C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-shadow">
      <stop offset="0" stop-color="#130C0E"/>
      <stop offset="1" stop-color="#130C0E" stop-opacity="0"/>
    </radialGradient>
    <!-- Reference shaker: smoky translucent black body, black cap + flip lid, black base compartment -->
    <clipPath id="ref-body-clip"><path d="M63 80 L137 80 L132.6 195 L67.4 195 Z"/></clipPath>
    <linearGradient id="r-smoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#2A2526"/>
      <stop offset=".3"  stop-color="#3E3739"/>
      <stop offset=".7"  stop-color="#332D2F"/>
      <stop offset="1"   stop-color="#1E1A1B"/>
    </linearGradient>
    <linearGradient id="r-black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#141011"/>
      <stop offset=".3"  stop-color="#2E2829"/>
      <stop offset=".65" stop-color="#1C1819"/>
      <stop offset="1"   stop-color="#0E0B0C"/>
    </linearGradient>
    <linearGradient id="r-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2627"/>
      <stop offset="1" stop-color="#151112"/>
    </linearGradient>
    <linearGradient id="r-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5254"/>
      <stop offset="1" stop-color="#433C3E"/>
    </linearGradient>
  </defs>

  <!-- Floor shadows -->
  <ellipse cx="72"  cy="238" rx="54" ry="6" fill="url(#g-shadow)" opacity=".2"/>
  <ellipse cx="200" cy="248" rx="44" ry="6" fill="url(#g-shadow)" opacity=".2"/>

  <!-- ===================== POUCH (back panel + powder) ===================== -->
  <path d="M29 106 L115 106 Q118 106 118.3 109 L120 124 L24 124 L25.7 109 Q26 106 29 106 Z" fill="url(#g-pouch-back)" stroke="#1E1819" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Zip seal strip and tear notch -->
  <rect x="27" y="110" width="90" height="3" rx="1.5" fill="#B9B3A7" opacity=".7"/>
  <path d="M118 106 L114 109 L118.3 112" fill="none" stroke="#1E1819" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Snow-white creatine inside the open pouch -->
  <path d="M27 124 Q44 113 72 112 Q100 113 117 124 Z" fill="url(#g-powder)" stroke="#1E1819" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 124 Q72 116 118 124 L118 128 Q72 122 26 128 Z" fill="url(#g-mouth)"/>
  <g fill="#D8D3C8">
    <circle cx="52" cy="118" r=".9"/><circle cx="64" cy="115" r=".8"/><circle cx="84" cy="116" r=".9"/><circle cx="96" cy="119" r=".8"/>
  </g>

  <!-- ===================== SCOOP (small creatine scoop) ===================== -->
  <g class="scoop">
    <!-- Long thin handle -->
    <path d="M-8 -7 L-46 -15 Q-50 -16 -50.5 -12.5 Q-51 -9.5 -47 -8.8 L-8 -1 Z" fill="url(#g-yellow)" stroke="#1E1819" stroke-width="2" stroke-linejoin="round"/>
    <!-- Level heap of powder -->
    <path class="heap" d="M-9 -9 Q-6 -15 0 -15.5 Q6 -15 9 -9 Z" fill="url(#g-powder)" stroke="#1E1819" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Cylindrical cup -->
    <path d="M-9 -9 L9 -9 L9 6 Q9 10 5 10 L-5 10 Q-9 10 -9 6 Z" fill="url(#g-yellow)" stroke="#1E1819" stroke-width="2.4" stroke-linejoin="round"/>
    <rect x="-10" y="-11" width="20" height="3.5" rx="1.5" fill="#FFD233" stroke="#1E1819" stroke-width="2"/>
    <path d="M-5 -4 L-5 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- ===================== POUCH (front panel) ===================== -->
  <path d="M24 120 Q72 127 120 120 L122 220 Q122 234 108 234 L36 234 Q22 234 22 220 Z" fill="url(#g-pouch)"/>
  <g clip-path="url(#pouch-clip)">
    <!-- Yellow wave at the bottom, like the real pouch -->
    <path d="M18 214 Q42 204 66 211 T124 206 L124 240 L18 240 Z" fill="url(#g-yellow)"/>
    <path d="M18 210 Q42 200 66 207 T124 202" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".7"/>
  </g>
  <!-- Brand + product name -->
  <text x="72" y="141" text-anchor="middle" font-family="Montserrat, 'Arial Black', Arial, sans-serif" font-size="8.5" font-weight="900" font-style="italic" fill="#1E1819" textLength="44" lengthAdjust="spacingAndGlyphs">PROTEINI.SI</text>
  <rect x="38" y="147" width="68" height="42" rx="1.5" fill="none" stroke="#FFCD00" stroke-width="2.5"/>
  <text x="72" y="164" text-anchor="middle" font-family="Montserrat, 'Arial Narrow', Arial, sans-serif" font-size="13" font-weight="900" fill="#1E1819" textLength="54" lengthAdjust="spacingAndGlyphs">100% PURE</text>
  <text x="72" y="183" text-anchor="middle" font-family="Montserrat, 'Arial Narrow', Arial, sans-serif" font-size="16" font-weight="900" fill="#1E1819" textLength="60" lengthAdjust="spacingAndGlyphs">CREATINE</text>
  <!-- Small info badges -->
  <g fill="#FFCD00">
    <rect x="47" y="193" width="13" height="8" rx="1"/>
    <rect x="65.5" y="193" width="13" height="8" rx="1"/>
    <rect x="84" y="193" width="13" height="8" rx="1"/>
  </g>
  <text x="72" y="199.5" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="5" font-weight="800" fill="#1E1819" word-spacing="9">3g 100% 0g</text>
  <!-- Pouch outline, gusset and highlight -->
  <path d="M24 120 Q72 127 120 120 L122 220 Q122 234 108 234 L36 234 Q22 234 22 220 Z" fill="none" stroke="#1E1819" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 226 Q72 220 114 226" fill="none" stroke="#1E1819" stroke-width="1.5" opacity=".3"/>
  <path d="M31 132 L29.5 205" stroke="url(#g-gloss)" stroke-width="4" stroke-linecap="round" opacity=".9"/>

  <!-- Micronized powder puffs up as the scoop digs in -->
  <g fill="#FFFFFF" stroke="#D8D3C8" stroke-width=".8">
    <circle class="puff"    cx="62" cy="113" r="3"/>
    <circle class="puff p2" cx="74" cy="110" r="2.4"/>
    <circle class="puff p3" cx="85" cy="114" r="2"/>
  </g>

  <!-- ===================== SHAKER (open, cap off) ===================== -->
  <g transform="translate(100 12)">
    <!-- Open shaker: cap is off, thread ring visible -->
    <rect x="61" y="70" width="78" height="10" rx="3" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="2.2"/>
    <g stroke="#FFFFFF" stroke-width="1" opacity=".12"><line x1="64" y1="73.5" x2="136" y2="73.5"/><line x1="64" y1="76.5" x2="136" y2="76.5"/></g>
    <!-- Smoky translucent body -->
    <path d="M60 78 L140 78 L135.5 197 L64.5 197 Z" fill="url(#r-smoke)"/>
    <ellipse cx="100" cy="193" rx="32" ry="3.5" fill="#141011" opacity=".6"/>

    <g clip-path="url(#ref-body-clip)">
      <!-- Water seen through the smoky plastic -->
      <g class="wave">
        <path d="M0 118 Q15 113 30 118 T60 118 T90 118 T120 118 T150 118 T180 118 T210 118 T240 118 L240 260 L0 260 Z" fill="#4E4749"/>
        <path d="M-15 121 Q0 117 15 121 T45 121 T75 121 T105 121 T135 121 T165 121 T195 121 T225 121 L225 260 L-15 260 Z" fill="url(#r-water)"/>
        <path d="M-15 121 Q0 117 15 121 T45 121 T75 121 T105 121 T135 121 T165 121 T195 121 T225 121" fill="none" stroke="#8C8486" stroke-width="1.6"/>
      </g>
      <!-- Creatine clouds the water, then settles -->
      <g class="cloud" filter="url(#soft)" fill="#FFFFFF">
        <ellipse cx="101" cy="130" rx="22" ry="8"/>
        <ellipse cx="94"  cy="146" rx="20" ry="9" opacity=".8"/>
        <ellipse cx="108" cy="166" rx="18" ry="10" opacity=".55"/>
        <ellipse cx="98"  cy="184" rx="22" ry="7" opacity=".7"/>
      </g>
      <path class="settle" d="M60 196 L60 189 Q80 185 100 186 Q120 185 140 189 L140 196 Z" fill="#F4F2EE" stroke="#BDB6A9" stroke-width="1"/>
      <!-- Vertical PROTEINI.SI print, as on the real shaker -->
      <g transform="translate(104 184) rotate(-90)">
        <text x="0" y="0" font-family="Montserrat, 'Arial Black', Arial, sans-serif" font-size="15" font-weight="900" font-style="italic" textLength="74" lengthAdjust="spacingAndGlyphs"><tspan fill="#FFFFFF">PROTEINI</tspan><tspan fill="#FFCD00">.SI</tspan></text>
        <text x="1" y="8" font-family="Montserrat, Arial, sans-serif" font-size="4.4" font-weight="700" fill="#FFFFFF" opacity=".9" textLength="70" lengthAdjust="spacing">SPORT NUTRITION CENTER</text>
      </g>
    </g>

    <ellipse class="ripple" cx="101" cy="119" rx="14" ry="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Plastic sheen, outline -->
    <path d="M69 86 L67.5 188" stroke="url(#r-gloss)" stroke-width="5" stroke-linecap="round"/>
    <path d="M131 88 L129.8 186" stroke="url(#r-gloss)" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <path d="M60 78 L140 78 L135.5 197 L64.5 197 Z" fill="none" stroke="#0E0B0C" stroke-width="3" stroke-linejoin="round"/>

    <!-- Black storage compartment at the bottom -->
    <path d="M63 194 L137 194 L137 200 L63 200 Z" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M64.5 200 L135.5 200 L134 224 Q134 232 126 232 L74 232 Q66 232 66 224 Z" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M72 204 L71.5 226" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".12"/>
  </g>

  <!-- Powder stream from the flipped scoop into the shaker -->
  <g class="stream" opacity="0">
    <path d="M194.5 60 L208.5 60 Q205.5 92 204.5 131 L198.5 131 Q197.5 92 194.5 60 Z" fill="url(#g-stream-edge)" stroke="#BFB8A9" stroke-width=".7" stroke-linejoin="round"/>
    <g fill="#CFC8B9">
      <circle cx="199" cy="72" r=".7"/><circle cx="203" cy="84" r=".6"/><circle cx="200" cy="98" r=".7"/><circle cx="202.5" cy="112" r=".6"/><circle cx="200.5" cy="123" r=".6"/>
    </g>
  </g>
  <!-- Splash where the powder hits the water -->
  <g fill="#FFFFFF" stroke="#CFC9BB" stroke-width=".6">
    <circle class="splash"    cx="201" cy="130" r="1.6" style="--dx:-7px"/>
    <circle class="splash s2" cx="202" cy="130" r="1.3" style="--dx:7px"/>
    <circle class="splash s3" cx="201" cy="130" r="1.1" style="--dx:-3px"/>
  </g>
  <g fill="#FFFFFF" stroke="#B9B2A3" stroke-width=".8">
    <circle class="grain" cx="197" cy="64" r="1.6"/>
    <circle class="grain g2" cx="206" cy="66" r="1.4"/>
    <circle class="grain g3" cx="199" cy="62" r="1.2"/>
    <circle class="grain g4" cx="205" cy="63" r="1.5"/>
    <circle class="grain g5" cx="201" cy="65" r="1.1"/>
    <circle class="grain g6" cx="203" cy="61" r="1.3"/>
    <circle class="grain g2" cx="196" cy="67" r="1.2"/>
    <circle class="grain g4" cx="207" cy="62" r="1.1"/>
  </g>

  <!-- Loading dots -->
  <circle class="dot"    cx="125" cy="258" r="3.5" fill="#2A2224"/>
  <circle class="dot d2" cx="137" cy="258" r="3.5" fill="#FFCD00"/>
  <circle class="dot d3" cx="149" cy="258" r="3.5" fill="#2A2224"/>
</svg>
