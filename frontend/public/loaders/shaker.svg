<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    /*
      Smooth pendulum shake: the bottle swings between two extremes on a
      sine-like ease (zero velocity at the ends, fastest through the centre),
      the liquid lags slightly behind, and everything else is phase-locked to it.
    */
    .sway  { transform-box: view-box; transform-origin: 100px 150px; animation: shake 1.6s cubic-bezier(.37,0,.63,1) infinite alternate; will-change: transform; }
    .bob   { transform-box: view-box; animation: bob .8s cubic-bezier(.37,0,.63,1) infinite alternate; }
    .slosh { transform-box: view-box; transform-origin: 100px 120px; animation: slosh 1.6s cubic-bezier(.37,0,.63,1) -3.02s infinite alternate; }
    .wave  { animation: wave 1.6s linear infinite; }
    .bubble { opacity: 0; animation: rise 2.4s cubic-bezier(.33,1,.68,1) infinite; }
    .b2 { animation-delay: .8s; } .b3 { animation-delay: 1.6s; }
    .lines-l, .lines-r { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .lines-l { animation: lines-l 3.2s ease-in-out infinite; }
    .lines-r { animation: lines-r 3.2s ease-in-out infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow .8s cubic-bezier(.37,0,.63,1) infinite alternate; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 1.2s cubic-bezier(.37,0,.63,1) infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }

    @keyframes shake {
      from { transform: translateX(-3px) rotate(-11deg); }
      to   { transform: translateX(3px)  rotate(11deg); }
    }
    @keyframes bob {
      from { transform: translateY(-5px); }
      to   { transform: translateY(0); }
    }
    @keyframes slosh {
      from { transform: translateY(2px) rotate(13deg); }
      to   { transform: translateY(2px) rotate(-13deg); }
    }
    @keyframes wave   { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes rise   {
      0%   { transform: translateY(0);     opacity: 0; }
      20%  { opacity: .85; }
      70%, 100% { transform: translateY(-50px); opacity: 0; }
    }
    /* Motion lines fade in on the side the bottle swings toward (one full swing = 3.2s) */
    @keyframes lines-l {
      0%, 100% { opacity: .75; }
      22%, 78% { opacity: 0; }
    }
    @keyframes lines-r {
      0%, 28%, 72%, 100% { opacity: 0; }
      50% { opacity: .75; }
    }
    @keyframes shadow {
      from { transform: scaleX(.86); opacity: .14; }
      to   { transform: scaleX(1);   opacity: .24; }
    }
    @keyframes pulse  {
      0%, 100% { opacity: .35; transform: translateY(0); }
      45% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sway, .bob, .slosh, .bubble, .shadow { animation: none; }
      .lines-l, .lines-r { animation: none; opacity: 0; }
      .wave { animation-duration: 4s; }
    }
  </style>

  <defs>
    <clipPath id="body-clip">
      <path d="M64 86 L136 86 L131 214 Q131 220 125 220 L75 220 Q69 220 69 214 Z"/>
    </clipPath>

    <linearGradient id="g-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFE173"/>
      <stop offset=".45" stop-color="#FFD02E"/>
      <stop offset="1"   stop-color="#F2B705"/>
    </linearGradient>
    <linearGradient id="g-liquid-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBA3"/>
      <stop offset="1" stop-color="#FFD84D"/>
    </linearGradient>
    <linearGradient id="g-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDB4D"/>
      <stop offset="1" stop-color="#F5BE00"/>
    </linearGradient>
    <linearGradient id="g-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1A1415"/>
      <stop offset=".35" stop-color="#3A3234"/>
      <stop offset="1"   stop-color="#151011"/>
    </linearGradient>
    <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset=".6"  stop-color="#FBFAF7"/>
      <stop offset="1"   stop-color="#EFECE6"/>
    </linearGradient>
    <linearGradient id="g-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1A1415"/>
      <stop offset=".35" stop-color="#2E2729"/>
      <stop offset="1"   stop-color="#141011"/>
    </linearGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-lines" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#FFCD00" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFCD00"/>
      <stop offset="1"  stop-color="#FFCD00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-shadow">
      <stop offset="0" stop-color="#130C0E"/>
      <stop offset="1" stop-color="#130C0E" stop-opacity="0"/>
    </radialGradient>
    <!-- Reference shaker: smoky translucent black body, black cap + flip lid, black base compartment -->
    <clipPath id="ref-body-clip"><path d="M63 80 L137 80 L132.6 195 L67.4 195 Z"/></clipPath>
    <linearGradient id="r-smoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#2A2526"/>
      <stop offset=".3"  stop-color="#3E3739"/>
      <stop offset=".7"  stop-color="#332D2F"/>
      <stop offset="1"   stop-color="#1E1A1B"/>
    </linearGradient>
    <linearGradient id="r-black" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#141011"/>
      <stop offset=".3"  stop-color="#2E2829"/>
      <stop offset=".65" stop-color="#1C1819"/>
      <stop offset="1"   stop-color="#0E0B0C"/>
    </linearGradient>
    <linearGradient id="r-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2627"/>
      <stop offset="1" stop-color="#151112"/>
    </linearGradient>
    <linearGradient id="r-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1"  stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft floor shadow -->
  <ellipse class="shadow" cx="100" cy="240" rx="44" ry="6" fill="url(#g-shadow)"/>

  <!-- Motion lines -->
  <g fill="none" stroke="url(#g-lines)" stroke-width="3.5" stroke-linecap="round">
    <g class="lines-l">
      <path d="M38 112 Q29 137 38 162"/>
      <path d="M25 122 Q19 137 25 152"/>
    </g>
    <g class="lines-r">
      <path d="M162 112 Q171 137 162 162"/>
      <path d="M175 122 Q181 137 175 152"/>
    </g>
  </g>

  <g class="sway"><g class="bob">
    <!-- Smoky translucent body -->
    <path d="M60 78 L140 78 L135.5 197 L64.5 197 Z" fill="url(#r-smoke)"/>
    <ellipse cx="100" cy="193" rx="32" ry="3.5" fill="#141011" opacity=".6"/>

    <g clip-path="url(#ref-body-clip)">
      <!-- Yellow shake seen through the smoky plastic -->
      <g class="slosh">
        <g class="wave">
          <path d="M0 118 Q15 113 30 118 T60 118 T90 118 T120 118 T150 118 T180 118 T210 118 T240 118 L240 260 L0 260 Z" fill="url(#g-liquid-back)" opacity=".7"/>
          <path d="M-15 121 Q0 117 15 121 T45 121 T75 121 T105 121 T135 121 T165 121 T195 121 T225 121 L225 260 L-15 260 Z" fill="url(#g-liquid)" opacity=".92"/>
          <path d="M-15 121 Q0 117 15 121 T45 121 T75 121 T105 121 T135 121 T165 121 T195 121 T225 121" fill="none" stroke="#FFE68A" stroke-width="1.6"/>
        </g>
      </g>
      <circle class="bubble"    cx="82"  cy="186" r="3"   fill="#FFF8DB"/>
      <circle class="bubble b2" cx="118" cy="188" r="2.4" fill="#FFF8DB"/>
      <circle class="bubble b3" cx="90"  cy="180" r="1.8" fill="#FFF8DB"/>
      <!-- Tint of the plastic over the liquid -->
      <rect x="40" y="80" width="120" height="120" fill="#1E1819" opacity=".16"/>
      <!-- Vertical PROTEINI.SI print, as on the real shaker -->
      <g transform="translate(104 184) rotate(-90)">
        <text x="0" y="0" font-family="Montserrat, 'Arial Black', Arial, sans-serif" font-size="15" font-weight="900" font-style="italic" textLength="74" lengthAdjust="spacingAndGlyphs"><tspan fill="#FFFFFF">PROTEINI</tspan><tspan fill="#FFCD00">.SI</tspan></text>
        <text x="1" y="8" font-family="Montserrat, Arial, sans-serif" font-size="4.4" font-weight="700" fill="#FFFFFF" opacity=".9" textLength="70" lengthAdjust="spacing">SPORT NUTRITION CENTER</text>
      </g>
    </g>

    <!-- Plastic sheen, outline -->
    <path d="M69 86 L67.5 188" stroke="url(#r-gloss)" stroke-width="5" stroke-linecap="round"/>
    <path d="M131 88 L129.8 186" stroke="url(#r-gloss)" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <path d="M60 78 L140 78 L135.5 197 L64.5 197 Z" fill="none" stroke="#0E0B0C" stroke-width="3" stroke-linejoin="round"/>

    <!-- Black storage compartment at the bottom -->
    <path d="M63 194 L137 194 L137 200 L63 200 Z" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M64.5 200 L135.5 200 L134 224 Q134 232 126 232 L74 232 Q66 232 66 224 Z" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M72 204 L71.5 226" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".12"/>

    <!-- Flip lid with thumb tab -->
    <path d="M66 41 L66 31 Q66 25 72 24.5 L124 20.5 Q132 20 132 27 L132 41 Z" fill="url(#r-lid)" stroke="#0E0B0C" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M58 25 L70 24 Q73 24 73 27 L73 31 L58 32 Q55 32 55 29 Q55 25 58 25 Z" fill="url(#r-lid)" stroke="#0E0B0C" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M76 27.5 L120 24.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".18"/>
    <!-- Cap -->
    <rect x="60" y="40" width="80" height="32" rx="5" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="2.5"/>
    <rect x="66" y="45" width="34" height="2" rx="1" fill="#FFFFFF" opacity=".14"/>
    <rect x="58" y="68" width="84" height="11" rx="3" fill="url(#r-black)" stroke="#0E0B0C" stroke-width="2.5"/>
  </g></g>

  <!-- Loading dots -->
  <circle class="dot"    cx="88"  cy="250" r="3.5" fill="#2A2224"/>
  <circle class="dot d2" cx="100" cy="250" r="3.5" fill="#FFCD00"/>
  <circle class="dot d3" cx="112" cy="250" r="3.5" fill="#2A2224"/>
</svg>
